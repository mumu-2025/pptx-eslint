name: decklint
on:
  pull_request:
  push:
jobs:
  lint-decks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python scripts/make_fixtures.py
      - name: Pytest
        run: pytest -q
      - name: Bad fixture must fail
        run: |
          if decklint check fixtures/bad --preset stage --lang en; then
            echo "expected failure on bad fixture" >&2
            exit 1
          fi
      - name: Good fixture must pass
        run: decklint check fixtures/good --preset stage --lang en
      - name: Contrast-fail must fail on a11y
        run: |
          if decklint check fixtures/contrast-fail --preset a11y; then
            echo "expected contrast failure" >&2
            exit 1
          fi
      - name: SARIF report
        if: always()
        run: |
          decklint check fixtures/bad --preset stage --format sarif --out decklint.sarif || true
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decklint-sarif
          path: decklint.sarif
